services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: passfordataaudit
      POSTGRES_DB: data_audit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      KAGGLE_API_KEY: ${KAGGLE_API_KEY}
      DATABASE_URL: postgresql://postgres:passfordataaudit@postgres:5432/data_audit
      FRONTEND_URL: http://localhost:5173
    volumes:
      - ./backend:/app/backend
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  postgres_data:
